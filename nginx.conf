# Beat Scrobble Nginx Configuration
# Edge caching and reverse proxy optimizations

# Cache zone for images
proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images_cache:10m max_size=1g inactive=30d use_temp_path=off;

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

upstream beat_scrobble {
    server app:4110;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_comp_level 6;

    # Brotli compression (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml;

    # ===========================================
    # Static Image Caching (Edge Cache)
    # ===========================================
    location /images/ {
        proxy_pass http://beat_scrobble;
        proxy_http_version 1.1;
        
        # Cache settings
        proxy_cache images_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        
        # Add cache status header
        add_header X-Cache-Status $upstream_cache_status;
        
        # Long browser cache
        add_header Cache-Control "public, max-age=2592000, immutable";
        
        # Bypass cache for specific cases
        proxy_cache_bypass $http_cache_control;
    }

    # ===========================================
    # Profile/Background Images
    # ===========================================
    location ~ ^/(profile-images|background-images)/ {
        proxy_pass http://beat_scrobble;
        proxy_http_version 1.1;
        
        proxy_cache images_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800";
    }

    # ===========================================
    # API Endpoints
    # ===========================================
    location /apis/ {
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://beat_scrobble;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # Don't cache API responses at edge
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ===========================================
    # Health Check (for load balancers)
    # ===========================================
    location /health {
        proxy_pass http://beat_scrobble/apis/web/v1/health;
        proxy_http_version 1.1;
        access_log off;
    }

    # ===========================================
    # Static Assets (React build)
    # ===========================================
    location /assets/ {
        proxy_pass http://beat_scrobble;
        proxy_http_version 1.1;
        
        # Immutable assets (hashed filenames)
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ===========================================
    # Default (SPA fallback)
    # ===========================================
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        
        proxy_pass http://beat_scrobble;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Short cache for HTML
        add_header Cache-Control "public, max-age=300";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
