# Docker Compose - Development with Hot Reload
# Backend: Go + Air (hot reload)
# Frontend: Runs LOCALLY (not in Docker) due to vanilla-extract issues
# Database: PostgreSQL + pgvector

version: '3.8'

services:
  # PostgreSQL Database
  bs-dev-db:
    image: pgvector/pgvector:pg16
    container_name: bs-dev-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=beatscrobbledb
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d beatscrobbledb" ]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - bs-dev-net

  # Go Backend with Air hot reload
  bs-dev-backend:
    image: golang:1.24-alpine
    container_name: bs-dev-backend
    working_dir: /app
    ports:
      - "4110:4110"
    volumes:
      - .:/app:Z
      - ${MUSIC_LOCATION:-./music}:/app/music:Z
      - ${CONFIG_LOCATION:-./config}:/etc/beat_scrobble:Z
    environment:
      - BEAT_SCROBBLE_DATABASE_URL=postgres://postgres:secret@bs-dev-db:5432/beatscrobbledb?sslmode=disable
      - BEAT_SCROBBLE_ALLOWED_HOSTS=*
      - MUSIC_LOCATION=/app/music
      - TZ=${TZ:-UTC}
      - GOTOOLCHAIN=auto
    command: sh -c "apk add --no-cache gcc musl-dev sqlite-dev vips-dev pkgconfig && go install github.com/air-verse/air@v1.52.3 && air"
    depends_on:
      bs-dev-db:
        condition: service_healthy
    networks:
      - bs-dev-net

# Frontend runs LOCALLY with: cd client && VITE_API_URL=http://localhost:4110 pnpm dev
# This avoids vanilla-extract cache issues in Docker

networks:
  bs-dev-net:
    driver: bridge
