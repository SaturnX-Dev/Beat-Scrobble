name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Generate Changelog
  changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.build_changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog-configuration.json"
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          ignorePreReleases: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build and Push Docker Image
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
             BEAT_SCROBBLE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Build Android APK
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./beatscrobble-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Building Debug APK for now since we don't have signing keys configured
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv beatscrobble-android/app/build/outputs/apk/debug/app-debug.apk beatscrobble-android/app/build/outputs/apk/debug/BeatScrobble-${{ github.ref_name }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatScrobble-${{ github.ref_name }}.apk
          path: beatscrobble-android/app/build/outputs/apk/debug/BeatScrobble-${{ github.ref_name }}.apk

  # 4. Create Release
  create-release:
    needs: [changelog, docker, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: BeatScrobble-${{ github.ref_name }}.apk
          path: ./assets

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ${{ needs.changelog.outputs.changelog }}

            ---
            
            ### 🐳 Docker Image
            `ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            
            ```bash
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
          files: |
            ./assets/BeatScrobble-${{ github.ref_name }}.apk
          draft: false
          # Mark as Pre-release if it starts with v0. OR contains a hyphen (v1.0.0-beta)
          prerelease: ${{ startsWith(github.ref, 'refs/tags/v0.') || contains(github.ref, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
