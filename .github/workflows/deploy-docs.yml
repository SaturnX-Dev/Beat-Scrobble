name: Deploy Docs to GitHub Pages

on:
  # Trigger on push to main branch targeting the docs folder
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, Build, and Upload Astro Site
        uses: withastro/action@v2
        with:
            path: ./docs               # Root of your Astro project
            node-version: 20           # Node version
            package-manager: yarn      # Package manager
            # 'dist' is the default output folder for Astro, the action handles it auto-magically

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
